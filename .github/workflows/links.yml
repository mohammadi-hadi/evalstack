name: links

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # doi.org rate-limits and answers 408 under load, so retry
          # generously and treat 408/429 as reachable. A dead DOI returns 404.
          args: >-
            --no-progress
            --max-retries 5
            --retry-wait-time 10
            --timeout 30
            --accept 200,206,408,429
            README.md
          fail: true

      - name: Keep the schedule alive
        # GitHub disables scheduled workflows after 60 days without a push.
        # Re-enabling it through the API keeps it on without a commit.
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/links.yml/enable
